[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "march-madness-model-lab"
version = "0.1.0"
description = "Reproducible NCAA tournament probability modeling with forward-season validation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scikit-learn>=1.3,<2",
]

[project.scripts]
madness-lab = "madness_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
